name: SniperChatGPT Historical Backtest
on:
  push:
    branches: [main]
    paths:
      - 'backtest.py'
      - 'export_excel.py'
      - 'strategy.py'
      - 'config.json'
      - 'data/instrument_universe.json'
      - 'requirements.txt'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Historical backtest
        run: python backtest.py
      - name: Create Excel workbook
        run: python export_excel.py
      - name: Commit reports for dashboard
        run: |
          git config user.name "sniperchatgpt-bot"
          git config user.email "sniperchatgpt-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "reports: refresh historical backtest"
          git push
      - name: Upload workbook and reports
        uses: actions/upload-artifact@v4
        with:
          name: sniperchatgpt-backtest
          path: reports/
          retention-days: 30
