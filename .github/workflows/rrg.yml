name: Sniper RRG data refresh
on:
  push:
    branches: [main]
    paths:
      - 'rrg_sniper.py'
      - 'data/instrument_universe.json'
      - 'reports/market_data.json'
      - '.github/workflows/rrg.yml'
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
concurrency:
  group: sniper-rrg-refresh
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install data dependencies
        run: pip install pandas yfinance
      - name: Generate RRG histories
        run: python rrg_sniper.py
      - name: Publish RRG data
        run: |
          git config user.name "sniperchatgpt-bot"
          git config user.email "sniperchatgpt-bot@users.noreply.github.com"
          git add reports/sniper_rrg.json reports/sniper_rrg_summary.json
          git diff --cached --quiet || git commit -m "data: refresh Sniper RRG weekly rotation"
          git pull --rebase origin main
          git push
