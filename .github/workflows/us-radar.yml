name: SNIPER USA Radar — evening reference
on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 22 * * *'
  push:
    branches: [main]
    paths:
      - 'us_radar.py'
      - 'data/us_underlying_mapping.json'
      - '.github/workflows/us-radar.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sniper-usa-radar
  cancel-in-progress: true
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch US reference closes
        run: python us_radar.py
      - name: Commit radar report
        run: |
          git config user.name "sniperchatgpt-bot"
          git config user.email "sniperchatgpt-bot@users.noreply.github.com"
          git add reports/us_radar.json
          git diff --cached --quiet || git commit -m "radar: refresh US underlying references"
          git pull --rebase origin main
          git push
