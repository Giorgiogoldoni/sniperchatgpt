name: SniperChatGPT PAPER Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * 1-5"

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run PAPER engine
        run: python run.py
      - name: Commit paper results
        run: |
          git config user.name "sniperchatgpt-bot"
          git config user.email "sniperchatgpt-bot@users.noreply.github.com"
          git add data/paper_state.json data/paper_trades.csv data/paper_summary.json
          git diff --cached --quiet || git commit -m "paper: daily update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
