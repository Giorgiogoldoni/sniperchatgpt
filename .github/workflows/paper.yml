name: SniperChatGPT PAPER Update

on:
  push:
    branches: [main]
    paths:
      - 'strategy.py'
      - 'paper_engine.py'
      - 'run.py'
      - 'tests/**'
      - 'config.json'
      - 'data/paper_state.json'
      - 'requirements.txt'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

concurrency:
  group: sniperchatgpt-paper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run PAPER engine (manual only, after backtest approval)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python run.py
      - name: Commit paper results
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "sniperchatgpt-bot"
          git config user.email "sniperchatgpt-bot@users.noreply.github.com"
          git add data/paper_state.json data/paper_trades.csv data/paper_summary.json data/last_scan_report.json
          git diff --cached --quiet || git commit -m "paper: daily update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
