name: Publish SniperChatGPT dashboard
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'rrg-sniper.html'
      - 'rrg_sniper.py'
      - 'reports/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate RRG JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('rrg-sniper.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if not scripts: raise SystemExit('No inline script found')
          pathlib.Path('/tmp/rrg-sniper.js').write_text('\\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/rrg-sniper.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
